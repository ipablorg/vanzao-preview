    <meta name="theme-color" content="#333f48" />
    <script>
      // Resuelve el tema antes del primer pintado (sin parpadeo): la elección manual
      // guardada manda; si no, el tema del sistema. Debe espejar src/hooks/useTheme.ts.
      ;(function () {
        try {
          var t = localStorage.getItem('vanzao.theme')
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          var root = document.documentElement
          root.dataset.theme = t
          root.style.colorScheme = t
          document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#12181d' : '#333f48')
        } catch (e) {}
      })()
    </script>
